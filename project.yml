name: mRecorder
options:
  bundleIdPrefix: io.github.yevgenmalafeyev
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  RecorderCore:
    path: Packages/RecorderCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  mRecorder:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - mRecorder.entitlements
    dependencies:
      - package: RecorderCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.yevgenmalafeyev.mrecorder
        PRODUCT_NAME: mRecorder
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/mRecorder.entitlements
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "3"
